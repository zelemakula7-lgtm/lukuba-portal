<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUKUBA SHOP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUKUBA SHOP">
<style>
:root{--n:#0b2545;--t:#13a89e;--bg:#f2f5f9;--c:#fff;--tx:#17212f;--m:#6b7788;--r:#d64545;--ok:#1f9d55}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--n);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;margin-right:auto;display:flex;align-items:center}.lg{width:32px;height:32px;border-radius:8px;margin-right:8px;background:#fff}header button{background:transparent;color:#fff;border:1px solid #ffffff55;padding:6px 10px;border-radius:8px}
header button.on{background:var(--t);border-color:var(--t)}
main{max-width:1000px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--c);border-radius:12px;padding:10px;box-shadow:0 1px 4px #0001}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e3e9f0;display:block}
.ph{display:flex;align-items:center;justify-content:center;color:var(--m)}
.pr{color:var(--n);font-weight:700}.mu{color:var(--m);font-size:13px}
button,input,select,textarea{font:inherit}
.b{background:var(--t);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.b.s{background:#e6ebf1;color:var(--tx)}.b.d{background:var(--r)}.b.g{background:var(--ok)}.b:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:9px;border:1px solid #cdd5df;border-radius:8px;margin:4px 0 8px;background:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e6ebf1}
.oos{background:var(--r);color:#fff}.in{background:#d9f3e4;color:#14703c}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.box{background:var(--c);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.narrow{max-width:380px;margin:30px auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9}
#toast div{background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 2px 8px #0005}
.st-Pending{background:#fff1cc}.st-Confirmed{background:#d6e8ff}.st-Processing{background:#e4dcff}.st-Delivered{background:#d9f3e4}.st-Cancelled{background:#fcdcdc}
.st-Ready\ for\ Collection,.st-Out\ for\ Delivery{background:#d3f4f1}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #e3e9f0;text-align:left;font-size:14px}
.brand{background:#fff;text-align:center;padding:8px 8px 4px}.brand img{width:44%;max-width:170px;height:auto}
.mq{background:var(--t);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0}
.mq span{display:inline-block;padding-left:100%;font-weight:700;letter-spacing:.3px;animation:mq 20s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--c);border-radius:12px;padding:12px;box-shadow:0 1px 4px #0001}.stat b{display:block;font-size:17px;color:var(--n)}
.edit{border:2px solid var(--t)}
</style>
</head>
<body>
<header id="hd"></header>
<div id="bn"></div>
<main id="app"></main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== 1. WEKA FIREBASE CONFIG YAKO HAPA (Firebase Console > Project settings > Your apps > Web) ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzfscDVyn7Mpu43t2XkOs1yCkFSBlA2m4",
  authDomain: "lukuba-shop-4fc20.firebaseapp.com",
  projectId: "lukuba-shop-4fc20",
  storageBucket: "lukuba-shop-4fc20.firebasestorage.app",
  messagingSenderId: "939958932227",
  appId: "1:939958932227:web:02d9325d8ac55169694f36"
};
/* ========================================================================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZS = n => 'TSh ' + Number(n || 0).toLocaleString('en-US');
const DEF_MQ = 'ASANTE KWA KUFANYA BIASHARA NASI KARIBU TENA LUKUBASHOP';
const ST = ['Pending','Confirmed','Processing','Ready for Collection','Out for Delivery','Delivered','Cancelled'];
const SW = {Pending:'Inasubiri','Confirmed':'Imethibitishwa',Processing:'Inaandaliwa','Ready for Collection':'Tayari kuchukuliwa','Out for Delivery':'Iko njiani (Delivery)',Delivered:'Imekamilika',Cancelled:'Imeghairiwa'};

let CST = {}, BIZ = {}, editId = null, dip = null, db, auth, me = null, P = {}, cart = {}, myO = [], allO = [], view = 'shop', tab = 'orders', q = '', cat = '', ofilter = '', mode = 'login', regData = null, unsub = [], firstO = true;
try { cart = JSON.parse(localStorage.getItem('lk_cart') || '{}'); } catch (e) {}
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; render(); });
window.addEventListener('appinstalled', () => { dip = null; render(); });
function installApp() {
  if (dip) { dip.prompt(); dip.userChoice.finally(() => { dip = null; render(); }); }
  else alert('Android (Chrome): bonyeza ⋮ juu kulia, kisha "Add to Home screen" au "Install app".\n\niPhone (Safari): bonyeza kitufe cha Share, kisha "Add to Home Screen".');
}
const isStaff = () => me && ['boss','manager','cashier','sales','driver','operator'].includes(me.role);
const isMgr = () => me && ['boss','manager'].includes(me.role);
const saveCart = () => { try { localStorage.setItem('lk_cart', JSON.stringify(cart)); } catch (e) {} };
const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);

function toast(m) {
  const d = document.createElement('div'); d.textContent = m; $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 5000);
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); o.stop(a.currentTime + .2); } catch (e) {}
  try { if (window.Notification && Notification.permission === 'granted') new Notification('LUKUBA SHOP', { body: m }); } catch (e) {}
}

/* ---------- START ---------- */
if (FIREBASE_CONFIG.apiKey === 'WEKA_HAPA') {
  document.addEventListener('DOMContentLoaded', () => {
    $('#app').innerHTML = '<div class="box"><h2>Weka Firebase config</h2><p>Fungua faili hili, tafuta <b>FIREBASE_CONFIG</b> na ubandike taarifa za project yako ya Firebase.</p></div>';
  });
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore(); auth = firebase.auth();
  try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  db.collection('products').onSnapshot(s => {
    P = {}; s.forEach(x => P[x.id] = { id: x.id, ...x.data() });
    let ch = false; Object.keys(cart).forEach(k => { if (!P[k]) { delete cart[k]; ch = true; } }); if (ch) saveCart();
    render();
  });
  db.collection('settings').doc('biz').onSnapshot(d => { BIZ = d.exists ? d.data() : {}; renderBanner(); render(); });
  auth.onAuthStateChanged(async u => {
    unsub.forEach(f => f()); unsub = []; actSub = 0; myO = []; allO = []; firstO = true;
    if (!u) { me = null; render(); return; }
    let d = await db.collection('users').doc(u.uid).get();
    if (!d.exists) {
      const nd = { name: regData?.name || u.email, phone: regData?.phone || '', email: u.email, role: 'customer' };
      await db.collection('users').doc(u.uid).set(nd); d = await db.collection('users').doc(u.uid).get();
    }
    me = { id: u.uid, ...d.data() };
    if (isMgr()) unsub.push(db.collection('costs').onSnapshot(s => { CST = {}; s.forEach(x => CST[x.id] = Number(x.data().cost) || 0); render(); }));
    subExtra();
    const col = db.collection('orders');
    const src = isStaff() ? col : col.where('uid', '==', u.uid);
    unsub.push(src.onSnapshot(s => {
      s.docChanges().forEach(c => {
        if (firstO) return;
        const o = c.doc.data();
        if (isStaff() && c.type === 'added') toast('Oda mpya #' + o.no + ' - ' + o.cname + ' - ' + TZS(o.total));
        if (!isStaff() && c.type === 'modified') toast('Oda #' + o.no + ': ' + SW[o.status]);
      });
      firstO = false;
      const arr = s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => b.no - a.no);
      if (isStaff()) allO = arr; else myO = arr;
      render();
    }));
    try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
    view = isStaff() ? 'admin' : 'shop'; render();
  });
}

/* ---------- BANNER (logo + ujumbe unaosogea) ---------- */
function renderBanner() {
  const b = $('#bn'); if (!b) return;
  const m = (BIZ.marquee && BIZ.marquee.trim()) || DEF_MQ;
  b.innerHTML = `<div class="brand"><img src="${BIZ.logo || 'logo.png'}" alt=""></div><div class="mq"><span style="animation-duration:${Math.max(14, Math.round(m.length * .35))}s">${esc(m)}</span></div>`;
}
function bizFooter() {
  if (!(BIZ.phone || BIZ.address || BIZ.email)) return '';
  return `<div class="box" style="margin-top:14px"><b>${esc(BIZ.name || 'LUKUBA SHOP')}</b>${BIZ.phone ? '<div>📞 ' + esc(BIZ.phone) + '</div>' : ''}${BIZ.address ? '<div>📍 ' + esc(BIZ.address) + '</div>' : ''}${BIZ.email ? '<div>✉️ ' + esc(BIZ.email) + '</div>' : ''}</div>`;
}

/* ---------- RENDER ---------- */
function doRender0() {
  if (!$('#app')) return;
  const nav = (v, t) => `<button class="${view === v ? 'on' : ''}" onclick="go('${v}')">${t}</button>`;
  $('#hd').innerHTML = `<b><img class="lg" src="icon-192.png" alt="">${esc(BIZ.name || 'LUKUBA SHOP')}</b>${standalone ? '' : '<button onclick="installApp()">📲 Weka kwenye simu</button>'}${nav('shop', 'Bidhaa')}${nav('cart', 'Cart (' + cartCount() + ')')}` +
    (me ? (nav('orders', 'Oda zangu') + bell() + (isStaff() ? nav('admin', 'Usimamizi') : '') + `<button onclick="auth.signOut()">Toka</button>`) : nav('auth', 'Ingia'));
  const a = $('#app'), keep = document.activeElement?.id;
  a.innerHTML = { shop: vShop, cart: vCart, orders: vOrders, admin: vAdmin, alerts: vAlerts, auth: vAuth }[view]();
  if (keep && $('#' + keep) && keep === 'q') { const e = $('#q'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
}
function go(v) { if ((v === 'orders') && !me) v = 'auth'; view = v; render(); scrollTo(0, 0); }

function vAuth() {
  const reg = mode === 'reg';
  return `<div class="box narrow"><h2>${reg ? 'Jisajili' : 'Ingia'}</h2>
  ${reg ? '<input id="rn" placeholder="Jina kamili"><input id="rp" placeholder="Namba ya simu (mf. 0712345678)" type="tel">' : ''}
  <input id="em" type="${reg?'email':'text'}" autocapitalize="none" autocomplete="username" placeholder="${reg?'Email':'Email au jina la kuingia (mfanyakazi)'}"><input id="pw" type="password" placeholder="Password (angalau herufi 6)">
  <button class="b" style="width:100%" onclick="${reg ? 'doReg()' : 'doLogin()'}">${reg ? 'Jisajili' : 'Ingia'}</button>
  <p class="mu" style="text-align:center;cursor:pointer" onclick="mode='${reg ? 'login' : 'reg'}';render()">${reg ? 'Tayari una akaunti? Ingia' : 'Huna akaunti? Jisajili'}</p></div>`;
}
const authErr = e => alert('Hitilafu: ' + ({ 'auth/invalid-credential': 'Jina/Email au password si sahihi', 'auth/user-not-found': 'Jina/Email haipo', 'auth/network-request-failed': 'Hakuna mtandao', 'auth/too-many-requests': 'Umejaribu mara nyingi, subiri kidogo', 'auth/email-already-in-use': 'Email tayari imesajiliwa', 'auth/weak-password': 'Password ni fupi sana' }[e.code] || e.message));
async function doLogin() { try { await auth.signInWithEmailAndPassword(toEmail($('#em').value), $('#pw').value); } catch (e) { authErr(e); } }
async function doReg() {
  const n = $('#rn').value.trim(), p = $('#rp').value.trim();
  if (!n || !p) return alert('Jaza jina na namba ya simu');
  regData = { name: n, phone: p };
  try { await auth.createUserWithEmailAndPassword($('#em').value.trim(), $('#pw').value); } catch (e) { authErr(e); }
}

function vShop() {
  const cats = [...new Set(Object.values(P).filter(p => p.active).map(p => p.category).filter(Boolean))];
  const list = Object.values(P).filter(p => p.active && (!cat || p.category === cat) && (!q || (p.name + ' ' + (p.category || '')).toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => (b.stock > 0) - (a.stock > 0) || a.name.localeCompare(b.name));
  return `<div class="row"><input id="q" placeholder="🔍 Tafuta bidhaa..." value="${esc(q)}" oninput="q=this.value;render()" style="flex:2">
  <select onchange="cat=this.value;render()" style="flex:1"><option value="">Category zote</option>${cats.map(c => `<option ${c === cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="grid">${list.map(p => `<div class="card">${p.img ? `<img src="${p.img}" alt="">` : '<div class="ph">Hakuna picha</div>'}
  <div style="margin-top:6px"><b>${esc(p.name)}</b></div><div class="mu">${esc(p.desc || '')}</div>
  <div class="pr">${TZS(p.price)}</div>
  <div style="margin:6px 0">${p.stock > 0 ? `<span class="tag in">Ipo</span>` : '<span class="tag oos">OUT OF STOCK</span>'}</div>
  <button class="b" style="width:100%" ${p.stock > 0 ? '' : 'disabled'} onclick="addCart('${p.id}')">${p.stock > 0 ? 'Weka kwenye cart' : 'Imeisha'}</button></div>`).join('') || '<p class="mu">Hakuna bidhaa.</p>'}</div>${bizFooter()}`;
}
function addCart(id) {
  const p = P[id]; if (!p || p.stock < 1) return;
  if ((cart[id] || 0) + 1 > p.stock) return toast('Zilizobaki ni ' + p.stock + ' tu');
  cart[id] = (cart[id] || 0) + 1; saveCart(); render(); toast(p.name + ' imeongezwa');
}
function chQty(id, d) {
  const p = P[id], n = (cart[id] || 0) + d;
  if (n <= 0) delete cart[id]; else if (p && n > p.stock) return toast('Zilizobaki ni ' + p.stock + ' tu'); else cart[id] = n;
  saveCart(); render();
}
function vCart() {
  const ids = Object.keys(cart).filter(i => P[i]);
  if (!ids.length) return '<div class="box">Cart yako ni tupu.</div>';
  const tot = ids.reduce((a, i) => a + P[i].price * cart[i], 0);
  return `<div class="box">${ids.map(i => `<div class="row" style="padding:6px 0;border-bottom:1px solid #e3e9f0"><div><b>${esc(P[i].name)}</b><div class="mu">${TZS(P[i].price)} · Zilizopo: ${P[i].stock}${P[i].stock < cart[i] || !P[i].active ? ' <span style="color:var(--r)">(stock haitoshi)</span>' : ''}</div></div>
  <div class="sp row"><button class="b s" onclick="chQty('${i}',-1)">−</button><b>${cart[i]}</b><button class="b s" onclick="chQty('${i}',1)">+</button><b style="min-width:100px;text-align:right">${TZS(P[i].price * cart[i])}</b></div></div>`).join('')}
  <h3 style="text-align:right">Jumla: ${TZS(tot)}</h3>
  ${me ? `<select id="m" onchange="$('#adw').style.display=this.value==='delivery'?'block':'none'"><option value="pickup">Nitajichukulia dukani</option><option value="delivery">Naomba delivery</option></select>
  <div id="adw" style="display:none"><input id="ad" placeholder="Anwani ya delivery (eneo, mtaa, alama)"></div>
  <textarea id="nt" rows="2" placeholder="Maelezo ya ziada (si lazima)"></textarea>
  <button class="b g" id="pb" style="width:100%" onclick="placeOrder()">Thibitisha na Tuma Oda</button>` : '<button class="b" style="width:100%" onclick="go(\'auth\')">Ingia ili kutuma oda</button>'}</div>`;
}

async function placeOrder() {
  const ids = Object.keys(cart).filter(i => cart[i] > 0);
  const method = $('#m').value, addr = ($('#ad')?.value || '').trim(), note = $('#nt').value.trim();
  if (!ids.length) return;
  if (method === 'delivery' && !addr) return alert('Weka anwani ya delivery');
  $('#pb').disabled = true;
  try {
    const cref = db.collection('meta').doc('counter'), oref = db.collection('orders').doc();
    let no = 0;
    await db.runTransaction(async t => {
      const cs = await t.get(cref);
      no = (cs.exists ? cs.data().n : 1000) + 1;
      const refs = ids.map(i => db.collection('products').doc(i));
      const snaps = await Promise.all(refs.map(r => t.get(r)));
      const items = [];
      snaps.forEach((s, k) => {
        if (!s.exists) throw new Error('Bidhaa haipatikani tena');
        const p = s.data(), n = cart[ids[k]];
        if (!p.active || p.stock < n) throw new Error('"' + p.name + '" haitoshi. Zilizobaki: ' + (p.active ? p.stock : 0));
        items.push({ id: ids[k], name: p.name, price: p.price, qty: n });
      });
      snaps.forEach((s, k) => t.update(refs[k], { stock: s.data().stock - cart[ids[k]] }));
      t.set(cref, { n: no });
      t.set(oref, { no, uid: me.id, cname: me.name, phone: me.phone || '', items, total: items.reduce((a, i) => a + i.price * i.qty, 0),
        method, addr, note, status: 'Pending', paid: 0, payStatus: 'none', branch: '', at: firebase.firestore.FieldValue.serverTimestamp() });
    });
    cart = {}; saveCart(); view = 'orders'; render(); toast('Oda #' + no + ' imetumwa. Subiri uthibitisho.');
  } catch (e) { alert(e.message); const b = $('#pb'); if (b) b.disabled = false; }
}

function oCard(o, staff) {
  const nx = ST.filter(s => s !== o.status);
  return `<div class="box st-${o.status}"><div class="row"><b>Oda #${o.no}</b><span class="tag">${SW[o.status]} (${o.status})</span>
  <span class="mu sp">${o.at?.toDate ? o.at.toDate().toLocaleString('sw-TZ') : ''}</span></div>
  ${staff ? `<div>👤 ${esc(o.cname)} · 📞 ${esc(o.phone)}</div>` : ''}
  <div class="mu">${o.method === 'delivery' ? '🚚 Delivery: ' + esc(o.addr) : '🏪 Kuchukua dukani'}${o.note ? ' · ' + esc(o.note) : ''}</div>
  <table>${o.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.qty} × ${TZS(i.price)}</td><td>${TZS(i.qty * i.price)}</td></tr>`).join('')}</table>
  <h4 style="text-align:right;margin:6px 0">Jumla: ${TZS(o.total)}</h4>${payInfo(o)}
  <div class="row" style="margin-bottom:8px">${isStaff() ? szSel() : ''}<button class="b s" onclick="printReceipt('${o.id}')">🖨 Print Risiti</button>${isStaff() && o.status !== 'Cancelled' ? `<button class="b s" onclick="rvId='${o.id}';render()">✏ Review</button>` : ''}</div>
  ${staff && isMgr() && !['Cancelled', 'Delivered'].includes(o.status) ? (o.status === 'Pending'
    ? `<div class="row"><button class="b g" onclick="setSt('${o.id}','Confirmed')">✔ Kubali</button><button class="b d" onclick="setSt('${o.id}','Cancelled')">✖ Kataa</button></div>`
    : `<div class="row"><select id="s${o.id}" style="max-width:240px;margin:0">${nx.map(s => `<option>${s}</option>`).join('')}</select><button class="b" onclick="setSt('${o.id}',$('#s${o.id}').value)">Badilisha hali</button></div>`) : ''}</div>`;
}
function vOrders() { return myO.length ? myO.map(o => oCard(o, false)).join('') : '<div class="box">Bado hujafanya oda.</div>'; }

function printReceipt(id) {
  const o = [...myO, ...allO].find(x => x.id === id); if (!o) return;
  const d = o.at && o.at.toDate ? o.at.toDate().toLocaleString('sw-TZ') : '';
  let logo = 'logo.png'; try { logo = new URL('logo.png', location.href).href; } catch (e) {}
  if (BIZ.logo) logo = BIZ.logo;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Risiti #${o.no}</title><style>
  body{font:14px Arial,sans-serif;max-width:${szW()};margin:0 auto;padding:12px;color:#000}.c{text-align:center}h2,h3{margin:4px 0}
  table{width:100%;border-collapse:collapse;margin:8px 0}td,th{padding:4px 2px;font-size:13px;text-align:left}th:last-child,td:last-child{text-align:right}
  .t{border-top:2px dashed #000;border-bottom:2px dashed #000;padding:6px 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between}
  @page{size:${szPg()};margin:4mm}hr{border:0;border-top:1px dashed #000}img{width:130px}</style></head><body>
  <div class="c"><img src="${logo}" alt=""><h2>${esc(BIZ.name || 'LUKUBA SHOP')}</h2>
  ${BIZ.phone ? '<div>Simu: ' + esc(BIZ.phone) + '</div>' : ''}${BIZ.address ? '<div>' + esc(BIZ.address) + '</div>' : ''}${BIZ.email ? '<div>' + esc(BIZ.email) + '</div>' : ''}</div><hr>
  <h3 class="c">RISITI YA ODA #${o.no}</h3>
  <div>Tarehe: ${esc(d)}</div><div>Mteja: ${esc(o.cname)}</div>${o.phone ? '<div>Simu: ' + esc(o.phone) + '</div>' : ''}

async function setSt(id, st) {
  if (st === 'Cancelled' && !await ask('Kuikataa/kuighairi oda kutarudisha stock. Endelea?')) return;
  try {
    await db.runTransaction(async t => {
      const r = db.collection('orders').doc(id), o = (await t.get(r)).data();
      if (['Cancelled', 'Delivered'].includes(o.status)) throw new Error('Oda hii imefungwa tayari');
      if (st === 'Cancelled') {
        const refs = o.items.map(i => db.collection('products').doc(i.id));
        const ps = await Promise.all(refs.map(x => t.get(x)));
        ps.forEach((p, k) => { if (p.exists) t.update(refs[k], { stock: p.data().stock + o.items[k].qty }); });
      }
      t.update(r, st === 'Confirmed' ? { status: st, payStatus: 'awaiting' } : { status: st });
    });
  } catch (e) { alert(e.message); }
}

  l.map(o=>`<div class="box row"><div><b>#${o.no} ${esc(o.cname)}</b><div class="mu">Jumla ${TZS(o.total)} · Amelipa ${TZS(o.paid)}</div><b style="color:var(--r)">Deni ${TZS(dbt(o))}</b></div>

/* --- Uza (mteja akiwa dukani) --- */
function aPos(){const ids=Object.keys(pos).filter(i=>P[i]),tot=sum(ids,i=>P[i].price*pos[i]);
  const l=Object.values(P).filter(p=>p.active&&p.stock>0&&(!q||p.name.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="box"><h3>🧾 Mauzo ya dukani</h3>${ids.map(i=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #e3e9f0"><b>${esc(P[i].name)}</b><div class="sp row"><button class="b s" onclick="posQ('${i}',-1)">−</button><b>${pos[i]}</b><button class="b s" onclick="posQ('${i}',1)">+</button><b style="min-width:90px;text-align:right">${TZS(P[i].price*pos[i])}</b></div></div>`).join('')||'<p class="mu">Chagua bidhaa hapa chini.</p>'}
  <h3 style="text-align:right">Jumla: ${TZS(tot)}</h3>
  <input placeholder="Jina la mteja (lazima akiwa na deni)" value="${esc(posN)}" oninput="posN=this.value">
  <input type="number" placeholder="Kiasi alicholipa (acha wazi = amelipa yote)" value="${posPd}" oninput="posPd=this.value">
  <button class="b g" style="width:100%" ${ids.length?'':'disabled'} onclick="doPos()">Kamilisha Mauzo</button></div>
  <input id="q" placeholder="🔍 Tafuta bidhaa..." value="${esc(q)}" oninput="q=this.value;render()">
  ${l.map(p=>`<div class="box row" style="margin-bottom:6px"><div><b>${esc(p.name)}</b><div class="mu">${TZS(p.price)} · Stock ${p.stock}</div></div><button class="b sp" onclick="posQ('${p.id}',1)">+ Ongeza</button></div>`).join('')}`}
function posQ(i,d){const n=(pos[i]||0)+d;if(n<=0)delete pos[i];else if(n>P[i].stock)return toast('Zilizobaki ni '+P[i].stock);else pos[i]=n;render()}
async function doPos(){const ids=Object.keys(pos).filter(i=>pos[i]>0&&P[i]);if(!ids.length)return;
  const tot=sum(ids,i=>P[i].price*pos[i]),paid=posPd===''?tot:Number(posPd);
  if(!(paid>=0)||paid>tot)return alert('Kiasi cha malipo si sahihi');
  if(paid<tot&&!posN.trim())return alert('Andika jina la mteja ili deni liandikwe');
  try{let no=0;const cref=db.collection('meta').doc('counter'),oref=db.collection('orders').doc();
  await db.runTransaction(async t=>{const cs=await t.get(cref);no=(cs.exists?cs.data().n:1000)+1;
    const refs=ids.map(i=>db.collection('products').doc(i)),sn=await Promise.all(refs.map(r=>t.get(r))),items=[];
    sn.forEach((s,k)=>{if(!s.exists)throw new Error('Bidhaa haipatikani');const p=s.data();if(p.stock<pos[ids[k]])throw new Error('"'+p.name+'" haitoshi');items.push({id:ids[k],name:p.name,price:p.price,qty:pos[ids[k]]})});
    sn.forEach((s,k)=>t.update(refs[k],{stock:s.data().stock-pos[ids[k]]}));t.set(cref,{n:no});
    t.set(oref,{no,uid:'pos',cname:posN.trim()||'Mteja wa dukani',phone:'',items,total:tot,method:'pickup',addr:'',note:'Mauzo ya dukani',status:'Delivered',source:'pos',paid,payStatus:'done',branch:me.branch||'',seller:me.name,at:SV()})});
  pos={};posN='';posPd='';render();toast('Mauzo #'+no+' yamekamilika'+(paid<tot?' · Deni '+TZS(tot-paid):''))}catch(e){alert(e.message)}}

/* --- Mishahara --- */
function aSal(){const l=Object.values(EMP).filter(e=>(!bsel||e.branch===bsel)&&(!q||e.name.toLowerCase().includes(q.toLowerCase()))),tot=sum(l,owed);
  return dl('dle',Object.values(EMP).map(e=>e.name))+`<input id="q" list="dle" placeholder="🔍 Tafuta mfanyakazi..." value="${esc(q)}" oninput="q=this.value;render()">`+brSel()+`<div class="box"><h3>Mishahara</h3><p class="mu">Mfanyakazi asipochukua mshahara wa mwezi, deni lake linajumlishwa mwezi unaofuata automatically.</p><div class="row"><b>Jumla inayodaiwa: ${TZS(tot)}</b><button class="b g sp" ${tot>0?'':'disabled'} onclick="paySal()">Lipa wote</button></div></div>`+
  l.map(e=>`<div class="box row"><div><b>${esc(e.name)}</b> <span class="tag">${esc(e.role)}</span><div class="mu">${TZS(e.salary)}/mwezi · Tangu ${esc(e.start||'-')} · Tawi: ${esc(bn(e.branch))}</div><b style="color:${owed(e)>0?'var(--r)':'var(--ok)'}">Anadai: ${TZS(owed(e))}</b></div>

<script>

/* Supplies */
function aSup(){return `<div class="box"><h3>Ongeza msambazaji</h3><input id="s_n" placeholder="Jina"><input id="s_p" type="tel" placeholder="Simu"><input id="s_a" placeholder="Anwani / bidhaa anazouza"><button class="b" onclick="addSup()">Hifadhi</button></div>`+
  SUP.map(s=>`<div class="box row"><div><b>${esc(s.name)}</b><div class="mu">${esc(s.phone||'')} · ${esc(s.addr||'')}</div><div class="mu">Manunuzi: ${TZS(sum(PUR.filter(p=>p.supplier===s.name),p=>p.amount))}</div></div><div class="sp row"><button class="b s" onclick="editSup('${s.id}')">✏ Hariri</button><button class="b d" onclick="delDoc('suppliers','${s.id}')">Futa</button></div></div>`).join('')}
async function addSup(){const n=$('#s_n').value.trim();if(!n)return alert('Andika jina');try{await db.collection('suppliers').add({name:n,phone:$('#s_p').value.trim(),addr:$('#s_a').value.trim()});clr(['s_n','s_p','s_a']);toast('Msambazaji ameongezwa: '+n)}catch(e){alert(e.message)}}
/* Manunuzi (cart) */
function aBuy(){return dl('dlp',Object.values(P).map(p=>p.name))+dl('dls',SUP.map(s=>s.name))+`<div class="box"><h3>🛒 Manunuzi (cart)</h3>
  <input list="dls" placeholder="Msambazaji (tafuta/chagua)" value="${esc(bsup)}" oninput="bsup=this.value"><input id="bp" list="dlp" placeholder="Bidhaa (tafuta/chagua)"><input id="bq" type="number" placeholder="Idadi"><input id="bk" type="number" placeholder="Bei ya kununua kwa kipande">
  <button class="b" onclick="bAdd()">+ Weka kwenye cart</button>${bc.map((x,i)=>`<div class="row" style="padding:4px 0"><span>${esc(x.n)} ×${x.q} @${TZS(x.c)}</span><b class="sp">${TZS(x.q*x.c)}</b><button class="b d" onclick="bc.splice(${i},1);render()">✖</button></div>`).join('')}
  <h3 style="text-align:right">Jumla: ${TZS(sum(bc,x=>x.q*x.c))}</h3><button class="b g" ${bc.length?'':'disabled'} onclick="bSave()">Kamilisha manunuzi</button></div>`+aMoney('purchases','Manunuzi mengine / historia')}
function bAdd(){const p=byName(Object.values(P),$('#bp').value),q=parseInt($('#bq').value),c=Number($('#bk').value)||CST[p&&p.id]||0;if(!p||!(q>0))return alert('Chagua bidhaa na idadi');bc.push({id:p.id,n:p.name,q,c});render()}
async function bSave(){const b=db.batch(),tot=sum(bc,x=>x.q*x.c);
  bc.forEach(x=>{b.update(db.collection('products').doc(x.id),{stock:firebase.firestore.FieldValue.increment(x.q)});if(x.c>0)b.set(db.collection('costs').doc(x.id),{cost:x.c})});
  b.set(db.collection('purchases').doc(),{name:'Stock: '+bc.map(x=>x.n+'×'+x.q).join(', '),items:bc,supplier:bsup,amount:tot,branch:me.branch||'',by:me.name,at:SV()});
  try{await b.commit();bc=[];bsup='';clr(['bq','bk']);clrcb('sup');clrcb('prod');render();toast('Manunuzi yamehifadhiwa, stock imeongezeka')}catch(e){alert(e.message)}}
/* Uza (cart) -> inaenda kwa cashier */
function aPos(){const ids=Object.keys(pos).filter(i=>P[i]),tot=sum(ids,i=>P[i].price*pos[i]);
  const l=Object.values(P).filter(p=>p.active&&p.stock>0&&(!q||p.name.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  return dl('dlc',CL().map(c=>c.name))+`<div class="box"><h3>🧾 Mauzo ya dukani (cart)</h3>${ids.map(i=>`<div class="row" style="padding:5px 0;border-bottom:1px solid #e3e9f0"><b>${esc(P[i].name)}</b><div class="sp row"><button class="b s" onclick="posQ('${i}',-1)">−</button><b>${pos[i]}</b><button class="b s" onclick="posQ('${i}',1)">+</button><b style="min-width:90px;text-align:right">${TZS(P[i].price*pos[i])}</b></div></div>`).join('')||'<p class="mu">Chagua bidhaa hapa chini.</p>'}
  <h3 style="text-align:right">Jumla: ${TZS(tot)}</h3><input list="dlc" placeholder="Mteja (tafuta au andika jina jipya)" value="${esc(posN)}" oninput="posN=this.value">
  <button class="b g" style="width:100%" ${ids.length?'':'disabled'} onclick="doPos()">Tuma oda kwa Cashier</button></div>
  <input id="q" placeholder="🔍 Tafuta bidhaa..." value="${esc(q)}" oninput="q=this.value;render()">${l.map(p=>`<div class="box row" style="margin-bottom:6px"><div><b>${esc(p.name)}</b><div class="mu">${TZS(p.price)} · Stock ${p.stock}</div></div><button class="b sp" onclick="posQ('${p.id}',1)">+ Ongeza</button></div>`).join('')}`}
async function doPos(){const ids=Object.keys(pos).filter(i=>pos[i]>0&&P[i]);if(!ids.length)return;
  try{const nm=posN.trim();let c=byName(CL(),nm);if(nm&&!c){const r=await db.collection('customers').add({name:nm,phone:'',at:SV()});c={id:r.id,name:nm,phone:''}}
  let no=0;const cref=db.collection('meta').doc('counter'),oref=db.collection('orders').doc();
  await db.runTransaction(async t=>{const cs=await t.get(cref);no=(cs.exists?cs.data().n:1000)+1;const refs=ids.map(i=>db.collection('products').doc(i)),sn=await Promise.all(refs.map(r=>t.get(r))),items=[];
    sn.forEach((s,k)=>{if(!s.exists)throw new Error('Bidhaa haipatikani');const p=s.data();if(p.stock<pos[ids[k]])throw new Error('"'+p.name+'" haitoshi');items.push({id:ids[k],name:p.name,price:p.price,qty:pos[ids[k]]})});
    sn.forEach((s,k)=>t.update(refs[k],{stock:s.data().stock-pos[ids[k]]}));t.set(cref,{n:no});
    t.set(oref,{no,uid:c?c.id:'walkin',cname:nm||'Mteja wa dukani',phone:c?c.phone:'',items,total:sum(items,i=>i.price*i.qty),method:'pickup',addr:'',note:'Mauzo ya dukani',status:'Confirmed',source:'pos',paid:0,payStatus:'awaiting',branch:me.branch||'',seller:me.name,at:SV()})});
  pos={};posN='';clrcb('cust');render();toast('Oda #'+no+' imetumwa kwa cashier')}catch(e){alert(e.message)}}
/* Review ya oda (ongeza / punguza / badili bidhaa) */
function rvBox(){const o=allO.find(x=>x.id===rvId);if(!o)return'';
  return dl('dlp',Object.values(P).map(p=>p.name))+`<div class="box" style="border:2px solid #0b2545"><b>✏ Review Oda #${o.no} · ${esc(o.cname)}</b>${o.items.map((i,k)=>`<div class="row" style="padding:4px 0"><span>${esc(i.name)} @${TZS(i.price)}</span><div class="sp row"><button class="b s" onclick="rvQ('${o.id}',${k},-1)">−</button><b>${i.qty}</b><button class="b s" onclick="rvQ('${o.id}',${k},1)">+</button><button class="b d" onclick="rvQ('${o.id}',${k},-9999)">✖</button></div></div>`).join('')}
  <div class="row"><input id="rp" list="dlp" placeholder="Ongeza / badilisha bidhaa (tafuta)" style="flex:1;margin:0"><button class="b" onclick="rvAdd('${o.id}')">+ Ongeza</button></div><b>Jumla: ${TZS(o.total)}</b> <button class="b s" onclick="rvId=null;render()">Funga</button></div>`}
async function rvEdit(oid,pid,d){try{await db.runTransaction(async t=>{const or=db.collection('orders').doc(oid),pr=db.collection('products').doc(pid),[os,ps]=await Promise.all([t.get(or),t.get(pr)]);
  const o=os.data(),items=o.items.map(i=>({...i})),p=ps.data();if(o.status==='Cancelled')throw new Error('Oda imefutwa');let it=items.find(i=>i.id===pid);
  if(!it){if(d<=0)return;it={id:pid,name:p.name,price:p.price,qty:0};items.push(it)}d=Math.max(d,-it.qty);if(d>p.stock)throw new Error('Stock haitoshi ('+p.stock+')');
  it.qty+=d;const f=items.filter(i=>i.qty>0);if(!f.length)throw new Error('Oda lazima iwe na bidhaa. Tumia Cancel kuifuta.');
  t.update(pr,{stock:p.stock-d});t.update(or,{items:f,total:sum(f,i=>i.price*i.qty)})})}catch(e){alert(e.message)}}
const rvQ=(oid,k,d)=>rvEdit(oid,allO.find(x=>x.id===oid).items[k].id,d);
function rvAdd(oid){const p=byName(Object.values(P),$('#rp').value);if(!p)return alert('Chagua bidhaa kwenye orodha');rvEdit(oid,p.id,1)}
const _aO=aOrders,_aP=aPay;aOrders=()=>rvBox()+_aO();aPay=()=>rvBox()+_aP();
/* Wafanyakazi: role */
function setRole(id,r){Promise.all([db.collection('users').doc(id).update({role:r}),db.collection('employees').doc(id).update({role:r})]).then(()=>toast('Wadhifa umebadilishwa')).catch(e=>alert(e.message))}
/* Akaunti yangu */
function aMe(){return `<div class="box" style="text-align:center">${me.img?`<img src="${me.img}" style="width:110px;height:110px;border-radius:50%;object-fit:cover">`:'<div style="font-size:70px">👤</div>'}<div><button class="b s" onclick="chImgMe()">📷 Badili picha</button></div></div>
  <div class="box"><h3>Akaunti yangu</h3><label class="mu">Jina</label><input id="u_n" value="${esc(me.name)}"><label class="mu">Simu</label><input id="u_p" value="${esc(me.phone||'')}">
  <div class="mu">${me.uname?'Jina la kuingia: '+esc(me.uname):'Email: '+esc(me.email||'')}<br>Wadhifa: <b>${esc(me.role)}</b><br>Tawi: ${esc(bn(me.branch))}<br>Unaweza kufikia: ${(isMgr()?['Zote']:(RT[me.role]||[]).map(t=>TL[t])).join(', ')}</div><button class="b g" onclick="saveMe()">Hifadhi</button></div>`}
async function saveMe(){const d={name:$('#u_n').value.trim()||me.name,phone:$('#u_p').value.trim()};try{await db.collection('users').doc(me.id).update(d);Object.assign(me,d);toast('Imehifadhiwa');render()}catch(e){alert(e.message)}}
function chImgMe(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){const img=await resize(i.files[0]);try{await db.collection('users').doc(me.id).update({img});me.img=img;render()}catch(e){alert(e.message)}}};i.click()}
/* Setting + taarifa za biashara (logo n.k.) */
function aBiz(){const f=(id,l,v,t)=>`<label class="mu">${l}</label><input id="${id}" ${t?`type="${t}"`:''} value="${esc(v||'')}">`;
  return `<div class="box"><h3>⚙ Setting / Taarifa za Biashara</h3><div style="text-align:center"><img id="lg" src="${BIZ.logo||'logo.png'}" style="max-height:90px"><div><button class="b s" onclick="pickLogo()">🖼 Badili logo</button></div></div>
  ${f('b_n','Jina la biashara',BIZ.name||'LUKUBA SHOP')}${f('b_s','Kauli mbiu (slogan)',BIZ.slogan)}${f('b_p','Namba ya simu',BIZ.phone,'tel')}${f('b_a','Anwani / eneo',BIZ.address)}${f('b_e','Email / WhatsApp',BIZ.email)}${f('b_t','TIN / Namba ya usajili',BIZ.tin)}${f('b_w','Website / Instagram',BIZ.web)}${f('b_l','Kiwango cha stock kuonya (kengere)',BIZ.low||5,'number')}${f('b_f','Ujumbe wa chini ya risiti',BIZ.note)}
  <label class="mu">Ujumbe unaosogea juu ya portal</label><textarea id="b_m" rows="3">${esc(BIZ.marquee||DEF_MQ)}</textarea><button class="b g" onclick="saveBiz()">Hifadhi</button></div>`}
function pickLogo(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){tmpLogo=await resize(i.files[0]);$('#lg').src=tmpLogo}};i.click()}
async function saveBiz(){const g=i=>$('#'+i).value.trim(),d={name:g('b_n'),slogan:g('b_s'),phone:g('b_p'),address:g('b_a'),email:g('b_e'),tin:g('b_t'),web:g('b_w'),low:Number(g('b_l'))||5,note:g('b_f'),marquee:g('b_m')};if(tmpLogo)d.logo=tmpLogo;
  try{await db.collection('settings').doc('biz').set(d,{merge:true});tmpLogo=null;toast('Setting zimehifadhiwa')}catch(e){alert('Imeshindwa: '+e.message)}}
</script>
<style>

</style>
<script>
/* ===== TOLEO 3: modal (hakuna alert ya github), login kwa jina, dropdown za kutafuta, haraka, Database ===== */
const STAFF_DOM='staff.lukuba.app',slug=u=>String(u||'').trim().toLowerCase().replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,''),
toEmail=v=>{v=String(v||'').trim();return v.includes('@')?v:slug(v)+'@'+STAFF_DOM};
let olim=40,lastSk='',ACT=[],dbk='orders',dbq='',dbN=100,actSub=0;
function mdl(msg,btns,inp,val){return new Promise(res=>{const o=document.createElement('div');o.id='mdl';
  o.innerHTML=`<div class="m"><b>LUKUBA SHOP</b><p style="margin-top:8px">${esc(msg)}</p>${inp?'<input id="mdi" type="text" inputmode="decimal">':''}<div class="row" style="justify-content:flex-end">${btns.map((b,i)=>`<button class="b ${b[2]||''}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;
  document.body.appendChild(o);const i=o.querySelector('#mdi');if(i){i.value=val??'';i.focus();i.select()}
  const done=v=>{o.remove();res(v)};
  o.onclick=e=>{const b=e.target.closest('button');if(b){const v=btns[b.dataset.i][1];done(inp&&v?i.value.trim():v)}};
  if(i)i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}
window.alert=m=>{m=String(m).replace(/Missing or insufficient permissions\.?/,'Huna ruhusa ya kuhifadhi: Firestore Rules hazijaruhusu kitendo hiki. Sasisha Rules kwenye Firebase.').replace(/client is offline/,'hakuna mtandao');mdl(m,[['Sawa',1]])};
const PW={};function permWarn(c){if(!PW[c]){PW[c]=1;toast('Ruhusa imekataliwa: '+c+'. Sasisha Firestore Rules.')}}
const ask=m=>mdl(m,[['Ghairi',0,'s'],['Ndiyo',1]]),askIn=(m,v)=>mdl(m,[['Ghairi',null,'s'],['Sawa',1]],1,v);
addEventListener('unhandledrejection',e=>{const r=e.reason||{},c=r.code||'';alert('Imeshindwa kuhifadhi: '+(c==='permission-denied'?'Huna ruhusa (angalia Firestore rules)':c==='unavailable'?'Hakuna mtandao, jaribu tena':r.message||r));e.preventDefault()});
const offBar=()=>{let b=$('#off');if(navigator.onLine){b&&b.remove()}else if(!b){b=document.createElement('div');b.id='off';b.textContent='Hakuna mtandao - data zitahifadhiwa mtandao ukirudi';document.body.appendChild(b)}};
addEventListener('online',offBar);addEventListener('offline',offBar);offBar();
const clr=a=>a.forEach(i=>document.querySelectorAll('#'+i).forEach(e=>e.value='')),clrcb=k=>document.querySelectorAll('[data-cb="'+k+'"]').forEach(e=>e.value='');
async function addStaff(){const g=i=>$('#'+i).value.trim(),n=g('f_n'),un=slug(n),pw=$('#f_w').value;
  if(!n||un.length<3||pw.length<6)return alert('Jaza jina (herufi 3+) na password (herufi 6+)');
  const em=un+'@'+STAFF_DOM;$('#f_btn').disabled=true;
  try{const a2=(firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec')).auth();let u;
    try{u=(await a2.createUserWithEmailAndPassword(em,pw)).user.uid}catch(e){if(e.code!=='auth/email-already-in-use')throw e;
      try{u=(await a2.signInWithEmailAndPassword(em,pw)).user.uid}catch(x){throw new Error('Jina "'+n+'" tayari limetumika. Tumia jina lingine.')}}
    const r=g('f_r'),br=g('f_b'),ph=g('f_p'),sl=Number(g('f_s'))||0,st=g('f_m');
    await db.collection('users').doc(u).set({name:n,phone:ph,email:em,uname:un,role:r,branch:br});
    await db.collection('employees').doc(u).set({name:n,phone:ph,role:r,branch:br,salary:sl,start:st});
    await a2.signOut();clr(['f_n','f_p','f_w','f_s']);toast('Akaunti ya '+n+' imeundwa. Anaingia kwa jina: '+un)}
  catch(e){alert('Imeshindwa: '+e.message)}finally{const b=$('#f_btn');if(b)b.disabled=false}}
/* dropdown ya kutafuta / kuchagua */
const CBS={cust:()=>CL().map(c=>[c.name,c.phone]),sup:()=>SUP.map(s=>[s.name,s.phone]),emp:()=>Object.values(EMP).map(e=>[e.name,e.role]),
 prod:()=>Object.values(P).filter(p=>p.active||view==='admin').map(p=>[p.name,TZS(p.price)+' · '+p.stock]),cat:()=>[...new Set(Object.values(P).map(p=>p.category).filter(Boolean))].map(c=>[c,''])};
let cbEl=null,cbBox=null,cbSel=-1;
function cbHide(){cbEl=null;if(cbBox)cbBox.style.display='none'}
function cbFill(){if(!cbEl)return;if(!cbBox){cbBox=document.createElement('div');cbBox.id='cbp';cbBox.onmousedown=e=>e.preventDefault();cbBox.onclick=e=>{const d=e.target.closest('[data-v]');if(d)cbPick(d.dataset.v)};document.body.appendChild(cbBox)}
  const v=cbEl.value.trim().toLowerCase(),l=(CBS[cbEl.dataset.cb]||(()=>[]))().filter(x=>!v||(x[0]+' '+(x[1]||'')).toLowerCase().includes(v)).sort((a,b)=>String(a[0]).localeCompare(b[0])).slice(0,60);
  cbBox.innerHTML=l.map((x,i)=>`<div data-v="${esc(x[0])}" class="${i===cbSel?'on':''}"><b>${esc(x[0])}</b><span>${esc(x[1]||'')}</span></div>`).join('')||'<div class="no">Hakuna kinacholingana (unaweza kuandika jina jipya)</div>';
  const r=cbEl.getBoundingClientRect(),below=innerHeight-r.bottom,up=below<200&&r.top>below;
  Object.assign(cbBox.style,{display:'block',left:r.left+'px',width:r.width+'px',top:up?'auto':r.bottom+2+'px',bottom:up?innerHeight-r.top+2+'px':'auto'})}
function cbPick(v){const e=cbEl;if(!e)return;e.value=v;e.blur();cbHide();e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.cb){cbEl=e.target;cbSel=-1;cbFill()}});
document.addEventListener('input',e=>{if(e.target===cbEl){cbSel=-1;cbFill()}});
document.addEventListener('focusout',e=>{const t=e.target;setTimeout(()=>{if(cbEl===t&&document.activeElement!==t)cbHide()},120)});
document.addEventListener('keydown',e=>{if(!cbEl||!cbBox)return;const n=cbBox.querySelectorAll('[data-v]').length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();cbSel=(cbSel+(e.key==='ArrowDown'?1:-1)+n)%(n||1);cbFill();const a=cbBox.querySelector('.on');a&&a.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&cbSel>=0){e.preventDefault();const a=cbBox.querySelectorAll('[data-v]')[cbSel];a&&cbPick(a.dataset.v)}else if(e.key==='Escape')cbHide()});
addEventListener('scroll',()=>{if(cbEl)cbFill()},true);addEventListener('resize',()=>{if(cbEl)cbFill()});
function enhance(){const A=$('#app');if(!A)return;
  A.querySelectorAll('input[list]').forEach(i=>{const k={dlc:'cust',dld:'cust',dls:'sup',dlp:'prod',dle:'emp'}[i.getAttribute('list')];if(k){i.removeAttribute('list');i.dataset.cb=k}});
  const m={q:view==='shop'||tab==='pos'?'prod':tab==='cust'?'cust':null,pc:'cat',e_c:'cat'};
  Object.keys(m).forEach(id=>{const e=A.querySelector('#'+id);if(e&&m[id])e.dataset.cb=m[id]});
  let n=0;A.querySelectorAll('[data-cb]').forEach(e=>{e.autocomplete='off';if(!e.id)e.id='cb_'+e.dataset.cb+'_'+(n++)});
  A.querySelectorAll('img').forEach(i=>{i.loading='lazy';i.decoding='async'})}
/* render ya haraka: inaunganisha, na haipotezi ulichoandika */
function render(){if(render.p)return;render.p=requestAnimationFrame(()=>{render.p=0;doRender()})}
function doRender(){const A=$('#app');if(!A)return;const sk=[view,tab,editId,mode,rvId].join('|'),same=sk===lastSk,old=[...A.querySelectorAll('input[id],textarea[id],select[id]')],ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd,sy=scrollY;lastSk=sk;
  doRender0();enhance();
  if(same)old.forEach(o=>{const n=document.getElementById(o.id);if(!n)return;if(o.type==='file')n.replaceWith(o);else if(o.type==='checkbox')n.checked=o.checked;else if(n.value!==o.value)n.value=o.value});
  const m=$('#m');if(m&&$('#adw'))$('#adw').style.display=m.value==='delivery'?'block':'none';
  if(aid){const e=document.getElementById(aid);if(e&&e!==document.activeElement){e.focus();try{e.setSelectionRange(ss,se)}catch(x){}}}
  if(same)scrollTo(0,sy);
  const a=document.activeElement;if(a&&a.dataset&&a.dataset.cb){cbEl=a;cbFill()}else cbHide()}
/* Database + Kumbukumbu (activity) */
const DBS={prod:['Bidhaa',()=>Object.values(P)],cust:['Wateja',()=>CL()],sup:['Wasambazaji',()=>SUP],orders:['Oda / Mauzo',()=>allO],buy:['Manunuzi',()=>PUR],exp:['Matumizi',()=>EXP],sal:['Mishahara iliyolipwa',()=>SPAY],staff:['Wafanyakazi',()=>Object.values(EMP)],br:['Matawi',()=>Object.values(BR)],act:['Kumbukumbu (kila kitendo)',()=>ACT]};
function flat(o){const r={};Object.keys(o).forEach(k=>{if(k==='img'||k==='logo')return;let v=o[k];if(v&&v.toDate)v=v.toDate().toLocaleString('sw-TZ');else if(Array.isArray(v))v=v.map(i=>i&&i.name?i.name+'×'+i.qty:JSON.stringify(i)).join(', ');else if(v&&typeof v==='object')v=JSON.stringify(v);r[k]=v});return r}
function dlFile(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csvOf(k){const rows=DBS[k][1]().map(flat),cols=[...new Set(rows.flatMap(r=>Object.keys(r)))],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return[cols.map(q).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n')}
const dbCsv=()=>dlFile('lukuba-'+dbk+'-'+new Date().toISOString().slice(0,10)+'.csv',csvOf(dbk),'text/csv'),
dbBackup=()=>{const o={tarehe:new Date().toISOString()};Object.keys(DBS).forEach(k=>o[k]=DBS[k][1]().map(flat));dlFile('lukuba-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(o,null,1),'application/json')};
function aDb(){if(!actSub){actSub=1;unsub.push(db.collection('activity').orderBy('at','desc').limit(300).onSnapshot(s=>{ACT=arr(s);render()},()=>{}))}
  const rows=DBS[dbk][1]().map(flat).filter(r=>!dbq||Object.values(r).join(' ').toLowerCase().includes(dbq.toLowerCase())),cols=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(c=>c!=='id').slice(0,8);
  return `<div class="box"><h3>🗄 Database</h3><p class="mu">Taarifa za kila kipengele (bidhaa, wateja, wasambazaji, oda, manunuzi, matumizi, mishahara, wafanyakazi, matawi) zinakusanywa hapa, pamoja na kumbukumbu ya kila kitendo kilichofanywa.</p>
  <div class="row"><select onchange="dbk=this.value;dbN=100;render()" style="flex:1">${Object.keys(DBS).map(k=>`<option value="${k}" ${k===dbk?'selected':''}>${DBS[k][0]} (${DBS[k][1]().length})</option>`).join('')}</select><input id="dbq" placeholder="🔍 Tafuta ndani ya data..." value="${esc(dbq)}" oninput="dbq=this.value;dbN=100;render()" style="flex:2"></div>
  <div class="row"><button class="b" onclick="dbCsv()">⬇ Pakua CSV (Excel)</button><button class="b s" onclick="dbBackup()">💾 Backup yote (JSON)</button></div></div>
  <div class="box" style="overflow-x:auto"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.slice(0,dbN).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')||'<tr><td>Hakuna data</td></tr>'}</table>
  ${rows.length>dbN?`<button class="b s" style="width:100%;margin-top:8px" onclick="dbN+=100;render()">Onyesha zaidi (${rows.length-dbN})</button>`:''}</div>`}
function logAct(m){if(!me)return;db.collection('activity').add({by:me.name||'',role:me.role||'',sec:view==='admin'?(TL[tab]||tab):'Duka',text:m,at:SV()}).catch(()=>{})}
const _toast=toast;toast=function(m){_toast(m);if(/imehifadhiwa|imeundwa|imefutwa|Malipo|Mauzo|Deni|imetumwa|imepunguzwa|imelipwa|imepokelewa|Mabadiliko|Wadhifa|imezimwa|ameongezwa|imeongezwa|imebadilishwa|Setting/.test(m)&&!/^Oda mpya|^Oda #\d+: /.test(m)&&!(view==='shop'&&/imeongezwa$/.test(m)))logAct(m)};

/* ===== Print: kila risiti ichapishwe peke yake (si ukurasa mzima) ===== */
function printDoc(html){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){alert('Imeshindwa kufungua print.')}setTimeout(()=>f.remove(),4000)},800)}
function printCust(n){n=String(n||'').trim();if(!n)return alert('Chagua mteja kwenye orodha');
  const L=allO.filter(o=>o.status!=='Cancelled'&&String(o.cname||'').toLowerCase()===n.toLowerCase()).sort((a,b)=>a.no-b.no);
  if(!L.length)return alert('Mteja "'+n+'" hana oda.');
  const T=sum(L,o=>o.total),pd=sum(L,o=>o.payStatus==='done'?o.paid:0),dd=sum(L,o=>o.payStatus==='done'?dbt(o):0),wt=sum(L,o=>o.payStatus==='done'?0:o.total),ph=(L.find(o=>o.phone)||{}).phone||'',
  logo=BIZ.logo||new URL('logo.png',location.href).href,N=x=>Number(x).toLocaleString('en-US'),row=(a,b)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${b}</span></div>`;
  printDoc(`<!doctype html><html><head><meta charset="utf-8"><title>Risiti ya mteja</title><style>
  body{font:14px Arial,sans-serif;max-width:${szW()};margin:0 auto;padding:12px;color:#000}.c{text-align:center}h2,h3{margin:4px 0}
  table{width:100%;border-collapse:collapse;margin:8px 0}td,th{padding:4px 2px;font-size:13px;text-align:left}th:last-child,td:last-child{text-align:right}td.g{text-align:left!important;border-top:1px dashed #000;padding-top:6px}
  .t{border-top:2px dashed #000;border-bottom:2px dashed #000;padding:6px 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between}
  @page{size:${szPg()};margin:4mm}hr{border:0;border-top:1px dashed #000}img{width:130px}</style></head><body>
  <div class="c"><img src="${logo}" alt=""><h2>${esc(BIZ.name||'LUKUBA SHOP')}</h2>
  ${BIZ.phone?'<div>Simu: '+esc(BIZ.phone)+'</div>':''}${BIZ.address?'<div>'+esc(BIZ.address)+'</div>':''}${BIZ.email?'<div>'+esc(BIZ.email)+'</div>':''}</div><hr>
  <h3 class="c">RISITI YA MTEJA</h3>
  <div>Tarehe: ${fd(new Date())}</div><div>Mteja: ${esc(L[0].cname)}</div>${ph?'<div>Simu: '+esc(ph)+'</div>':''}<div>Idadi ya oda: ${L.length}</div><hr>
  <table><tr><th>Bidhaa</th><th>Idadi</th><th>Bei</th><th>Jumla</th></tr>
  ${L.map(o=>`<tr><td class="g" colspan="4"><b>Oda #${o.no}</b> · ${fd(dt(o))}</td></tr>`+o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${N(i.price)}</td><td>${N(i.qty*i.price)}</td></tr>`).join('')).join('')}</table>
  <div class="t"><span>JUMLA</span><span>${TZS(T)}</span></div>
  ${row('Amelipa',TZS(pd))}${wt?row('Inasubiri malipo',TZS(wt)):''}${dd?row('<b>DENI</b>','<b>'+TZS(dd)+'</b>'):''}
  <p class="c">${esc(BIZ.note||'Asante kwa kufanya biashara nasi. Karibu tena!')}</p></body></html>`)}
aCust=(o=>()=>`<div class="box"><h3>🖨 Risiti ya mteja mmoja</h3><input id="pcn" data-cb="cust" placeholder="Tafuta/chagua mteja"><button class="b" onclick="printCust($('#pcn').value)">Print risiti ya mteja</button></div>`+o())(aCust);

/* ===== Hariri taarifa (wafanyakazi, wasambazaji, wateja, matawi, manunuzi/matumizi) + password ===== */
function formModal(title,F){return new Promise(res=>{const o=document.createElement('div');o.id='mdl';
  o.innerHTML=`<div class="m" style="max-height:90vh;overflow:auto"><b>${esc(title)}</b>${F.map((f,i)=>`<label class="mu">${esc(f.l)}</label>${f.o?`<select id="fm${i}">${f.o.map(x=>`<option value="${esc(x[0])}" ${x[0]===f.v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input id="fm${i}" type="${f.t||'text'}" value="${esc(f.v??'')}">`}`).join('')}<div class="row" style="justify-content:flex-end"><button class="b s" data-x="0">Ghairi</button><button class="b g" data-x="1">Hifadhi</button></div></div>`;
  document.body.appendChild(o);
  o.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.x==='0'){o.remove();res(null)}else{const r={};F.forEach((f,i)=>{const v=o.querySelector('#fm'+i).value.trim();r[f.k]=f.t==='number'?Number(v)||0:v});o.remove();res(r)}}})}
async function editEmp(id){const e=EMP[id];if(!e)return;
  const r=await formModal('Hariri mfanyakazi',[{k:'name',l:'Jina',v:e.name},{k:'phone',l:'Simu',v:e.phone||'',t:'tel'},{k:'salary',l:'Mshahara kwa mwezi (TSh)',v:e.salary||0,t:'number'},{k:'start',l:'Anaanza mshahara mwezi',v:e.start||'',t:'month'},{k:'branch',l:'Tawi',v:e.branch||'',o:[['','Hakuna'],...Object.values(BR).map(b=>[b.id,b.name])]}]);
  if(!r)return;if(!r.name)return alert('Andika jina');
  try{const b=db.batch();b.update(db.collection('users').doc(id),{name:r.name,phone:r.phone,branch:r.branch});b.update(db.collection('employees').doc(id),r);await b.commit();toast('Taarifa za '+r.name+' zimebadilishwa')}catch(x){alert(x.message)}}
async function editSup(id){const e=SUP.find(x=>x.id===id);if(!e)return;
  const r=await formModal('Hariri msambazaji',[{k:'name',l:'Jina',v:e.name},{k:'phone',l:'Simu',v:e.phone||'',t:'tel'},{k:'addr',l:'Anwani / bidhaa anazouza',v:e.addr||''}]);
  if(!r)return;if(!r.name)return alert('Andika jina');
  if(r.name.toLowerCase()!==e.name.toLowerCase()&&byName(SUP,r.name))return alert('Jina hili lipo tayari');
  try{await db.collection('suppliers').doc(id).update(r);toast('Taarifa za msambazaji zimebadilishwa')}catch(x){alert(x.message)}}
async function editCus(id,coll){const e=(coll==='users'?UC:CU).find(x=>x.id===id);if(!e)return;
  const r=await formModal('Hariri mteja',[{k:'name',l:'Jina',v:e.name},{k:'phone',l:'Simu',v:e.phone||'',t:'tel'}]);
  if(!r)return;if(!r.name)return alert('Andika jina');
  const d=byName(CL(),r.name);if(d&&d.id!==id)return alert('Mteja mwenye jina hili yupo tayari');
  try{await db.collection(coll).doc(id).update(r);toast('Taarifa za mteja zimebadilishwa')}catch(x){alert(x.message)}}
async function editBr(id){const e=BR[id];if(!e)return;
  const r=await formModal('Hariri tawi',[{k:'name',l:'Jina la tawi',v:e.name},{k:'addr',l:'Anwani / eneo',v:e.addr||''}]);
  if(!r)return;if(!r.name)return alert('Andika jina');
  try{await db.collection('branches').doc(id).update(r);toast('Tawi limebadilishwa')}catch(x){alert(x.message)}}
async function editMoney(c,id){const e=(c==='expenses'?EXP:PUR).find(x=>x.id===id);if(!e)return;
  const r=await formModal('Hariri rekodi',[{k:'name',l:'Maelezo',v:e.name},{k:'amount',l:'Kiasi (TSh)',v:e.amount,t:'number'}]);
  if(!r)return;if(!r.name||!(r.amount>0))return alert('Jaza maelezo na kiasi');
  try{await db.collection(c).doc(id).update(r);toast('Rekodi imebadilishwa')}catch(x){alert(x.message)}}
async function changePw(){const a=$('#pw1').value,b=$('#pw2').value;if(a.length<6)return alert('Password iwe herufi 6 au zaidi');if(a!==b)return alert('Password hazilingani');
  try{await auth.currentUser.updatePassword(a);clr(['pw1','pw2']);toast('Password imebadilishwa')}catch(e){alert(e.code==='auth/requires-recent-login'?'Toka (Logout) kisha ingia tena, halafu jaribu kubadilisha password.':e.message)}}
aMe=(o=>()=>o()+`<div class="box"><h3>🔑 Badilisha password</h3><input id="pw1" type="password" placeholder="Password mpya (herufi 6+)" autocomplete="new-password"><input id="pw2" type="password" placeholder="Rudia password mpya" autocomplete="new-password"><button class="b g" onclick="changePw()">Hifadhi password</button></div>`)(aMe);
</script>
